services:
  - type: web
    name: umami
    env: docker
    repo: https://github.com/umami-software/umami.git
    branch: master
    plan: free
    dockerCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umami-db
          property: connectionString
      - key: HASH_SALT
        generateValue: true

databases:
  - name: umami-db
    plan: free
    databaseName: umami
    user: umami